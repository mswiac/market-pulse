<div class="admin-panel-page">
  <h2 i18n="@@adminPanel.title">Fetch market data</h2>

  @if (loading()) {
    <div class="loading">
      <mat-progress-spinner
        mode="indeterminate"
        diameter="40"
        i18n-aria-label="@@adminPanel.loading.ariaLabel"
        aria-label="Loading instruments"
      ></mat-progress-spinner>
    </div>
  } @else if (loadError()) {
    <p class="form-error" i18n="@@instrumentHistory.error.instrumentsLoadFailed">
      Failed to load instruments. Please refresh the page and try again.
    </p>
  } @else {
    <mat-card class="fetch-card" appearance="outlined">
      <app-instrument-picker [ticker]="selectedTicker()" (tickerChange)="onTickerChange($event)" />

      <div class="filters">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label i18n="@@adminPanel.from.label">From</mat-label>
          <input matInput [matDatepicker]="fromPicker" [value]="fromDate()" (dateChange)="onFromDateChange($event.value)" />
          <mat-datepicker-toggle matIconSuffix [for]="fromPicker"></mat-datepicker-toggle>
          <mat-datepicker #fromPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label i18n="@@adminPanel.to.label">To</mat-label>
          <input matInput [matDatepicker]="toPicker" [value]="toDate()" (dateChange)="onToDateChange($event.value)" />
          <mat-datepicker-toggle matIconSuffix [for]="toPicker"></mat-datepicker-toggle>
          <mat-datepicker #toPicker></mat-datepicker>
        </mat-form-field>
      </div>

      <button mat-flat-button color="primary" type="button" [disabled]="!canSubmit()" (click)="onSubmit()" i18n="@@adminPanel.submit">
        Fetch market data
      </button>
    </mat-card>
  }
</div>
