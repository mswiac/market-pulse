<div class="remove-instrument-page">
  <h2 i18n="@@removeInstrument.title">Remove instrument</h2>

  @if (loading()) {
    <div class="loading">
      <mat-progress-spinner
        mode="indeterminate"
        diameter="40"
        i18n-aria-label="@@removeInstrument.loading.ariaLabel"
        aria-label="Loading instruments"
      ></mat-progress-spinner>
    </div>
  } @else if (loadError()) {
    <p class="form-error" i18n="@@instrumentHistory.error.instrumentsLoadFailed">
      Failed to load instruments. Please refresh the page and try again.
    </p>
  } @else if (noInstruments()) {
    <p class="form-error" i18n="@@removeInstrument.noInstruments">No instruments available to remove.</p>
  } @else {
    <mat-card class="remove-card" appearance="outlined">
      <app-instrument-picker [ticker]="selectedTicker()" [disabled]="submitting()" (tickerChange)="onTickerChange($event)" />

      <button mat-flat-button color="warn" type="button" [disabled]="!canSubmit()" (click)="onSubmit()" i18n="@@removeInstrument.submit">
        Remove instrument
      </button>
    </mat-card>
  }
</div>
